<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEUS AI — O Olimpo</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b18;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;text-align:center;
 background:linear-gradient(120deg,#111a35,#38245e);
 border-bottom:1px solid #d5a83b;
}
header h1{color:#f7cc68;letter-spacing:5px;margin:0}
header p{color:#c5c8d8}
nav{display:flex;justify-content:center;gap:10px;padding:15px;flex-wrap:wrap}
button{
 background:#222b48;color:white;border:1px solid #b98b35;
 padding:12px 18px;border-radius:10px;cursor:pointer;
}
button:hover{background:#59421e}
main{max-width:1100px;margin:auto;padding:15px}
h2{text-align:center;color:#f5ca69}
.gods{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:15px;
}
.god{
 background:#151b31;border:1px solid #45405e;
 border-radius:14px;padding:10px;text-align:center;cursor:pointer;
 transition:.3s;
}
.god:hover{transform:translateY(-5px);border-color:#f5ca69}
.god img{
 width:100%;height:155px;object-fit:cover;
 border-radius:10px;background:#252b40;
}
.god h3{margin:10px 0;color:#f5ca69}
#conversation{display:none;text-align:center}
.avatar{
 width:190px;height:190px;border-radius:50%;
 object-fit:cover;border:3px solid #f5ca69;
 box-shadow:0 0 25px #b98b35;
}
.talking{animation:glow .8s infinite alternate}
@keyframes glow{
 from{box-shadow:0 0 10px #b98b35}
 to{box-shadow:0 0 35px #ffe08a}
}
.speaking{
 animation:mouth .22s infinite alternate;
}
@keyframes mouth{
 from{transform:scale(1)}
 to{transform:scale(1.025)}
}
#messages{
 background:#11182b;border-radius:12px;padding:15px;
 min-height:150px;max-height:300px;overflow:auto;text-align:left;
 margin:15px 0;
}
.msg{padding:10px;margin:8px 0;border-radius:9px;background:#222b48}
.user{background:#354064}
input{
 width:100%;padding:14px;border-radius:9px;
 border:1px solid #777;background:#10182c;color:white;
 margin:8px 0;
}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#art{display:none;text-align:center}
#result img{max-width:100%;border-radius:12px;margin-top:15px}
.small{color:#aeb5cb;font-size:13px}
</style>
</head>

<body>
<header>
<h1>⚡ ZEUS AI ⚡</h1>
<p>O poder da inteligência do Olimpo</p>
</header>

<nav>
<button onclick="showHall()">🏛️ Olimpo</button>
<button onclick="showArt()">🎨 ZEUS ART</button>
</nav>

<main>
<section id="hall">
<h2>Escolha sua divindade</h2>
<div class="gods" id="gods"></div>
</section>

<section id="conversation">
<button onclick="showHall()">← Voltar ao Olimpo</button>
<h2 id="godName"></h2>
<img id="godAvatar" class="avatar" alt="Retrato da divindade">
<p id="godDescription" class="small"></p>
<div id="messages"></div>
<input id="question" placeholder="Converse com esta divindade...">
<div class="actions">
<button onclick="sendMessage()">Enviar mensagem</button>
<button onclick="startVoice()">🎙️ Falar</button>
<button onclick="stopVoice()">🔇 Parar voz</button>
</div>
</section>

<section id="art">
<h2>🎨 ZEUS ART</h2>
<p>Descreva a imagem que deseja criar.</p>
<input id="prompt" placeholder="Ex.: Zeus sentado em seu trono no Olimpo">
<button onclick="generateImage()">Criar imagem</button>
<div id="result"></div>
</section>
</main>

<script>
const deities = [
{name:"Zeus",emoji:"⚡",desc:"Deus dos céus e soberano do Olimpo.",voice:"pt-BR-AntonioNeural",prompt:"Zeus, poderoso deus grego, barba branca, olhos brilhantes, raios, armadura dourada, retrato mitológico cinematográfico"},
{name:"Poseidon",emoji:"🔱",desc:"Senhor dos mares e oceanos.",prompt:"Poseidon, deus grego dos mares, barba imponente, tridente, oceano e ondas, retrato mitológico cinematográfico"},
{name:"Hades",emoji:"🔥",desc:"Governante do mundo subterrâneo.",prompt:"Hades, deus grego do submundo, aparência sombria, coroa escura, chamas azuis, retrato mitológico cinematográfico"},
{name:"Atena",emoji:"🦉",desc:"Deusa da sabedoria e estratégia.",prompt:"Atena, deusa grega da sabedoria, armadura dourada, elmo, olhos sábios, retrato mitológico cinematográfico"},
{name:"Ares",emoji:"⚔️",desc:"Deus da guerra e da coragem.",prompt:"Ares, deus grego da guerra, guerreiro musculoso, armadura de bronze, elmo, retrato mitológico cinematográfico"},
{name:"Apolo",emoji:"☀️",desc:"Deus da luz, música e artes.",prompt:"Apolo, deus grego da luz, jovem de cabelos dourados, aura solar, lira, retrato mitológico cinematográfico"},
{name:"Afrodite",emoji:"🌹",desc:"Deusa do amor e da beleza.",prompt:"Afrodite, deusa grega da beleza, aparência elegante, cabelos longos, flores e luz dourada, retrato mitológico cinematográfico"},
{name:"Hermes",emoji:"🪽",desc:"Mensageiro dos deuses.",prompt:"Hermes, deus mensageiro grego, capacete alado, aparência jovem, sandálias aladas, retrato mitológico cinematográfico"},
{name:"Hefesto",emoji:"🔨",desc:"Deus do fogo e da forja.",prompt:"Hefesto, deus grego da forja, ferreiro poderoso, martelo, oficina com fogo, retrato mitológico cinematográfico"},
{name:"Deméter",emoji:"🌾",desc:"Deusa da agricultura e das colheitas.",prompt:"Deméter, deusa grega da agricultura, mulher majestosa, cabelos dourados, trigo e natureza, retrato mitológico cinematográfico"}
];

let selected=null;
const gods=document.getElementById("gods");

function imageURL(prompt){
 return "https://image.pollinations.ai/prompt/"+encodeURIComponent(prompt)+
 "?width=512&height=640&nologo=true";
}

deities.forEach((god,index)=>{
 const card=document.createElement("div");
 card.className="god";
 card.innerHTML=`
 <img loading="lazy" src="${imageURL(god.prompt)}" alt="${god.name}"
 onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('afterbegin','<div style=&quot;font-size:75px;padding:35px&quot;>${god.emoji}</div>')">
 <h3>${god.name}</h3><p class="small">${god.desc}</p>`;
 card.onclick=()=>chooseGod(index);
 gods.appendChild(card);
});

function showHall(){
 document.getElementById("hall").style.display="block";
 document.getElementById("conversation").style.display="none";
 document.getElementById("art").style.display="none";
}
function showArt(){
 document.getElementById("hall").style.display="none";
 document.getElementById("conversation").style.display="none";
 document.getElementById("art").style.display="block";
}
function chooseGod(index){
 selected=deities[index];
 document.getElementById("hall").style.display="none";
 document.getElementById("art").style.display="none";
 document.getElementById("conversation").style.display="block";
 document.getElementById("godName").textContent=selected.emoji+" "+selected.name;
 document.getElementById("godDescription").textContent=selected.desc;
 const avatar=document.getElementById("godAvatar");
 avatar.src=imageURL(selected.prompt);
 avatar.className="avatar";
 document.getElementById("messages").innerHTML=
 `<div class="msg">${selected.name}: Saudações, mortal. O que desejas saber?</div>`;
}

function addMessage(text,type){
 const box=document.getElementById("messages");
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 box.appendChild(div);
 box.scrollTop=box.scrollHeight;
}

async function sendMessage(){
 const input=document.getElementById("question");
 const message=input.value.trim();
 if(!message || !selected)return;
 input.value="";
 addMessage("Você: "+message,"user");
 const avatar=document.getElementById("godAvatar");
 avatar.classList.add("talking");
 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:"Você é "+selected.name+", uma divindade da mitologia grega. "+
    "Responda em português brasileiro, mantendo sua personalidade mitológica. "+
    "Mensagem do usuário: "+message
   })
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Falha na conversa.");
  const answer=data.choices?.[0]?.message?.content||
               data.answer||data.response||"Não consegui responder.";
  addMessage(selected.name+": "+answer,"");
  speak(answer);
 }catch(error){
  addMessage("Erro: "+error.message,"");
 }finally{
  avatar.classList.remove("talking");
 }
}

function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="pt-BR";
 utterance.rate=0.92;
 const avatar=document.getElementById("godAvatar");
 utterance.onstart=()=>avatar.classList.add("speaking","talking");
 utterance.onend=()=>avatar.classList.remove("speaking","talking");
 speechSynthesis.speak(utterance);
}

function startVoice(){
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){alert("Seu navegador não oferece reconhecimento de voz. Use o teclado.");return;}
 const recognition=new Recognition();
 recognition.lang="pt-BR";
 recognition.onresult=(event)=>{
  document.getElementById("question").value=event.results[0][0].transcript;
  sendMessage();
 };
 recognition.start();
}
function stopVoice(){
 speechSynthesis.cancel();
 document.getElementById("godAvatar").classList.remove("speaking","talking");
}

async function generateImage(){
 const prompt=document.getElementById("prompt").value.trim();
 if(!prompt)return alert("Escreva uma descrição primeiro.");
 const result=document.getElementById("result");
 result.textContent="Criando sua imagem...";
 try{
  const response=await fetch("/api/image",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt})
  });
  if(!response.ok)throw new Error("Não foi possível gerar a imagem.");
  const type=response.headers.get("content-type")||"";
  if(type.startsWith("image/")){
   const blob=await response.blob();
   result.innerHTML="";
   const img=document.createElement("img");
   img.src=URL.createObjectURL(blob);
   result.appendChild(img);
  }else{
   const data=await response.json();
   const url=data.url||data.imageUrl||data.image;
   if(!url)throw new Error(data.error||"Resposta de imagem inválida.");
   result.innerHTML="";
   const img=document.createElement("img");
   img.src=url;
   result.appendChild(img);
  }
 }catch(error){result.textContent="Erro: "+error.message;}
}
</script>
</body>
</html>
